spring:
  datasource:
    url: jdbc:h2:mem:snapword;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:8081

jwt:
  secret: test-secret-key-at-least-32-bytes-long-for-hmac
  expiration-ms: 3600000

dictionary:
